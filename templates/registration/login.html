{% extends "base.html" %}

{% block title %}
Iniciar sesión | FinanSmart
{% endblock %}

{% block content %}
<div class="card">
    <h1>Iniciar sesión</h1>

    {% if form.errors %}
        <p class="errorlist">
            Usuario o contraseña incorrectos.
        </p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Iniciar sesión
        </button>
    </form>
</div>
{% endblock %}
