server {
    listen 80;
    server_name localhost;

    # Nueva funcionalidad extraída: microservicio Flask
    location /api/v2/recommendations/ {
        proxy_pass http://recommendation_service:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API legacy: conserva Django detrás de una ruta v1
    # /api/v1/expenses/ -> Django /api/expenses/
    location /api/v1/ {
        proxy_pass http://django_web:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend y demás rutas del monolito siguen en Django
    location / {
        proxy_pass http://django_web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
