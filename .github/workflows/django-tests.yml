name: FinanSmart - Django CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  django-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar dependencias Flask
        run: pip install -r recommendation_service/requirements.txt

      - name: Verificar configuracion
        run: python manage.py check

      - name: Verificar migraciones
        run: python manage.py makemigrations --check --dry-run

      - name: Preparar archivos estaticos
        run: python manage.py collectstatic --noinput

      - name: Ejecutar pruebas Django
        run: python manage.py test

      - name: Probar microservicio Flask
        run: python -m unittest discover -s recommendation_service/tests -p "test_*.py" -v
