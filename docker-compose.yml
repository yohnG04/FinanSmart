services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-finansmart}
      POSTGRES_USER: ${DB_USER:-finansmart}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-finansmart} -d ${DB_NAME:-finansmart}"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  django_web:
    build:
      context: .
    restart: unless-stopped
    environment: &django_env
      DB_ENGINE: postgresql
      DB_NAME: ${DB_NAME:-finansmart}
      DB_USER: ${DB_USER:-finansmart}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_HOST: db
      DB_PORT: '5432'
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,django_web}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      RECOMMENDATION_ENGINE: REMOTE
      RECOMMENDATION_SERVICE_URL: http://recommendation_service:5000/api/v2/recommendations/
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      VOLT_BASE_URL: ${VOLT_BASE_URL:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}

    command: >-
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn finansmart.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      recommendation_service:
        condition: service_healthy
    expose:
      - '8000'

  celery_worker:
    build:
      context: .
    restart: unless-stopped
    environment: *django_env
    command: celery -A finansmart worker -l info --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  recommendation_service:
    build:
      context: ./recommendation_service
    restart: unless-stopped
    expose:
      - '5000'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health/', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 15

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-8080}:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - acme_data:/var/www/certbot:ro
    depends_on:
      - django_web
      - recommendation_service

  certbot:
    image: certbot/certbot:v5.4.0
    profiles: [certificates]
    volumes:
      - acme_data:/var/www/certbot
      - certbot_data:/etc/letsencrypt

volumes:
  postgres_data:
  acme_data:
  certbot_data:
