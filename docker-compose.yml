services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finansmart
      POSTGRES_USER: finansmart
      POSTGRES_PASSWORD: finansmart
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finansmart -d finansmart"]
      interval: 5s
      timeout: 5s
      retries: 10

  django_web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_ENGINE: postgresql
      DB_NAME: finansmart
      DB_USER: finansmart
      DB_PASSWORD: finansmart
      DB_HOST: db
      DB_PORT: "5432"
      RECOMMENDATION_ENGINE: REAL
      ALLOWED_HOSTS: localhost,127.0.0.1,django_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  recommendation_service:
    build:
      context: ./recommendation_service
      dockerfile: Dockerfile
    expose:
      - "5000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health/')"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      django_web:
        condition: service_started
      recommendation_service:
        condition: service_healthy

volumes:
  postgres_data:
